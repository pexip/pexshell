
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    { name = "cpufeatures", version = "0.2.17" },    # older line is still required by crypto deps outside rand 0.10
    { name = "untrusted", version = "0.7.1" },       # old version used by aws-lc-rs, used by jsonwebtoken
    { name = "syn", version = "2.0.117" },           # parser for rust source code. not all crates have moved to the newer version
    { name = "base64", version = "0.22" },            # older version still used by jsonwebtoken and wiremock
]
# Crate dependency trees that will be skipped when doing duplicate detection.
skip-tree = [
    { name = "rand_core", version = "0.6.4" },           # Old version used by several crates
    { name = "security-framework", version = "2.11.1" }, # keyring uses old version
    { name = "windows-sys", version = "*" },             # multiple crates use old versions - no stable release yet, so this is inevitable
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
